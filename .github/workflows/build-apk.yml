name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # يضمن وجود Android SDK (وإصدار compileSdk 34) بغض النظر عن محتوى صورة الـ runner الافتراضية
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # لا نعتمد على ملف gradlew/gradle-wrapper.jar المحلي (قد لا يكون موجودًا في هذا الأرشيف)
      # بل نستخدم إجراء Gradle الرسمي الذي يقوم بتنزيل وتشغيل Gradle مباشرة بأمان.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
